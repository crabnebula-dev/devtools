[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# Dependabot treats (transitive) unsound as security issue.
# Reflect that in cargo deny.
unsound = "all"
ignore = [
    # proc-macro-error - unmaintained (required by gtk3/glib macros)
    "RUSTSEC-2024-0370",
    # instant - unmaintained (required by v1 tao crate)
    "RUSTSEC-2024-0384",
    # fxhash - unmaintained (required by tauri-utils via kuchikiki)
    "RUSTSEC-2025-0057",
    # unic-* crates - unmaintained (required by tauri-utils via urlpattern)
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # glib 0.18.5 unsoundness, blocked on Tauri upstream moving to gtk4
    "RUSTSEC-2024-0429",
    # rand 0.7 unsoundness, required in Tauri v1 and v2.
    "RUSTSEC-2026-0097",
]

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "ISC",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
]

[[licenses.clarify]]
name = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# Exceptions should be targeting just the crates that need it.
# bzip2 is used by CEF downloader. Which is an option for Tauri v3.
[[licenses.exceptions]]
allow = ["bzip2-1.0.6"]
name = "libbz2-rs-sys"
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
name = "target-lexicon"
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"
[[licenses.exceptions]]
allow = ["Zlib"]
name = "foldhash"

[licenses.private]
# If true, ignores workspace crates that aren't published, or are only
# published to private registries.
# To see how to mark a crate as unpublished (to the official registry),
# visit https://doc.rust-lang.org/cargo/reference/manifest.html#the-publish-field.
ignore = true

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Warn when a crate version requirement is `*`
wildcards = "warn"
# Having different versions of the same crate is common and produces too much warning noise.
multiple-versions = "allow"
