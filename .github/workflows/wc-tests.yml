name: Web Client Tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "clients/web/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "clients/web/**"

permissions:
  contents: read

jobs:
  check-js-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 11
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "clients/web/pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install -g license-checker
      - name: Check JavaScript Licenses
        working-directory: clients/web
        run: license-checker --summary --onlyAllow="MIT;Apache-2.0;BSD-2-Clause" --excludePackages="spa-client@0.0.0"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 11
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "clients/web/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: clients/web
        run: pnpm install install

      - name: Format
        working-directory: clients/web
        run: pnpm prettier --check '**/*.{ts,tsx,js,jsx,json}'

      - name: Linting
        working-directory: clients/web
        run: pnpm lint

      - name: Unit tests
        working-directory: clients/web
        run: pnpm test -- --run
